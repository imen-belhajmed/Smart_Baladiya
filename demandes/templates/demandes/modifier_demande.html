{% extends 'demandes/base_demandes.html' %}
{% block title %}Modifier ma demande{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-body p-4">
  <h2>Modifier ma demande</h2>
  <p class="text-muted">{{ demande.get_type_document_display }} – modifiable tant qu'elle est en attente.</p>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {% include 'demandes/_champs.html' %}
    <button class="btn btn-primary">Mettre à jour</button>
    <a href="{% url 'demandes:liste' %}" class="btn btn-light">Retour</a>
  </form>
</div></div></div></div>
{% endblock %}
