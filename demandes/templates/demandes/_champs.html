{{ form.non_field_errors }}
{% for f in form %}
  <div class="mb-3">
    <label class="form-label fw-semibold" for="{{ f.id_for_label }}">{{ f.label }}</label>
    {{ f }}
    {% if f.help_text %}<div class="form-text">{{ f.help_text }}</div>{% endif %}
    {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
  </div>
{% endfor %}
