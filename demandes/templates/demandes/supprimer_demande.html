{% extends 'demandes/base_demandes.html' %}
{% block title %}Supprimer la demande{% endblock %}
{% block content %}
<div class="card mx-auto text-center" style="max-width:520px"><div class="card-body p-4">
  <h3>Supprimer cette demande ?</h3>
  <p>{{ demande.get_type_document_display }} – {{ demande.citoyen }}</p>
  <p class="text-muted">Cette action est définitive.</p>
  <form method="post">{% csrf_token %}<button class="btn btn-danger">Oui, supprimer</button> <a href="{% url 'demandes:detail' demande.pk %}" class="btn btn-light">Annuler</a></form>
</div></div>
{% endblock %}
