{% extends 'base.html' %}
{% block title %}Supprimer la demande{% endblock %}
{% block content %}
<div class="card" style="max-width:560px; margin:0 auto; text-align:center">
    <h1>Supprimer cette demande ?</h1>
    <p>{{ demande.get_type_document_display }} – {{ demande.citoyen }}</p>
    <p class="sous-titre">Cette action est définitive.</p>
    <form method="post" class="actions" style="justify-content:center">
        {% csrf_token %}
        <button type="submit" class="btn btn-rouge">Oui, supprimer</button>
        <a href="{% url 'demandes:detail' demande.pk %}" class="btn">Annuler</a>
    </form>
</div>
{% endblock %}
