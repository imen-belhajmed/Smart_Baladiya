{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-body">
            <h2 class="card-title mb-4">Effectuer une nouvelle demande</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-3">Soumettre la demande</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'demandes:liste' %}" class="text-decoration-none">Retour à mes demandes</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
