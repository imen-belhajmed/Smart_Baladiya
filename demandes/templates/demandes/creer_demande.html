{% extends 'base.html' %}
{% block title %}Nouvelle demande{% endblock %}
{% block content %}
<div class="card" style="max-width:640px; margin:0 auto">
    <h1>Effectuer une nouvelle demande</h1>
    <p class="sous-titre" style="margin-bottom:1.2rem">Le délai de traitement est estimé automatiquement et vous serez notifié à chaque étape.</p>
    <form method="post" enctype="multipart/form-data" class="formulaire">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit" class="btn btn-vert">Soumettre la demande</button>
            <a href="{% url 'demandes:liste' %}" class="btn">Retour à mes demandes</a>
        </div>
    </form>
</div>
{% endblock %}
