{% extends "forum_events/base.html" %}
{% block title %}Edit profile picture{% endblock %}
{% block content %}
  <h1>Edit profile picture</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save picture</button>
    <a href="{% url 'forum:profile' user.username %}">Cancel</a>
  </form>
{% endblock %}
