{% extends "forum_events/base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
  <h1>{{ page_title }}</h1>
  <section class="form-card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button type="submit">Save</button>
        <a class="button secondary" href="{{ cancel_url }}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
