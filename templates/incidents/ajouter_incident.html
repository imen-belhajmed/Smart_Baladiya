{% extends "base.html" %}
{% load static %}
{% block title %}Signaler un incident{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/incidents.css' %}">

<div class="incidents-page">
    <h2>Signaler un incident</h2>

    <form method="post" enctype="multipart/form-data" class="incident-form">
        {% csrf_token %}
        {{ form.as_div }}
        <div class="incident-form-actions">
            <button type="submit" class="btn">Envoyer le signalement</button>
            <a href="{% url 'incidents:list' %}" class="btn btn-petit">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
