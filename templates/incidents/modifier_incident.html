{% extends "base.html" %}
{% block content %}
<div class="container my-4" style="max-width: 700px;">
  <h2 class="mb-3">Modifier : {{ incident.titre }}</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-success mt-3">Enregistrer</button>
    <a href="{% url 'incidents:detail' incident.pk %}" class="btn btn-outline-secondary mt-3">Annuler</a>
  </form>
</div>
{% endblock %}
