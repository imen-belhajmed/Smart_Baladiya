{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}
  <h1>Créer un compte</h1>
  <section class="card">
    <form method="post" class="formulaire">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button class="btn btn-bleu" type="submit">S'inscrire</button>
        <a class="btn" href="{% url 'accounts:login' %}">J'ai déjà un compte</a>
      </div>
    </form>
  </section>
{% endblock %}
