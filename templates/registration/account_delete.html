{% extends "base.html" %}
{% block title %}Supprimer mon compte{% endblock %}
{% block content %}
<h1>Supprimer mon compte</h1>
<section class="card">
  <p><strong>Cette action est définitive.</strong> Toutes les données liées à votre compte seront supprimées.</p>
  <form method="post" class="formulaire">
    {% csrf_token %}
    <div class="actions">
      <button class="btn btn-rouge" type="submit">Confirmer la suppression</button>
      <a class="btn" href="{% url 'accounts:profile' %}">Annuler</a>
    </div>
  </form>
</section>
{% endblock %}
