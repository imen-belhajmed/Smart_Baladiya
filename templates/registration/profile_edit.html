{% extends "base.html" %}
{% block title %}Modifier mon profil{% endblock %}
{% block content %}
<h1>Modifier mon profil</h1>
<section class="card">
  <form method="post" enctype="multipart/form-data" class="formulaire">
    {% csrf_token %}
    {{ user_form.as_p }}
    {{ profile_form.as_p }}
    <div class="actions">
      <button class="btn btn-bleu" type="submit">Enregistrer</button>
      <a class="btn" href="{% url 'accounts:profile' %}">Annuler</a>
    </div>
  </form>
</section>
{% endblock %}
