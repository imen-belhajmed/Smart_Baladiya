{% extends "base.html" %}

{% block content %}
<div class="container py-4" style="max-width: 550px;">
  <div class="card border-danger">
    <div class="card-body">
      <h1 class="h4 text-danger mb-3">Confirmer la suppression</h1>
      <p>
        Êtes-vous sûr de vouloir supprimer le commerçant
        <strong>{{ commercant.prenom }} {{ commercant.nom }}</strong> (CIN : <code>{{ commercant.cin }}</code>) ?
      </p>
      <form method="post" class="d-flex justify-content-end gap-2">
        {% csrf_token %}
        <a href="{% url 'marches:liste_commercants' %}" class="btn btn-secondary">Annuler</a>
        <button type="submit" class="btn btn-danger">Supprimer définitivement</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
